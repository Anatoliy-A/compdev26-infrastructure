name: terraform-plan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-roots:
    runs-on: ubuntu-latest
    outputs:
      roots: ${{ steps.select.outputs.roots }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: select
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo 'roots=["infra","platform","workloads/guestbook"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only HEAD^ HEAD)"
          roots=()

          if grep -qE '^(infra/|\.github/workflows/)' <<< "$changed"; then
            roots+=(infra platform 'workloads/guestbook')
          else
            grep -q '^platform/' <<< "$changed" && roots+=(platform)
            grep -q '^workloads/guestbook/' <<< "$changed" && roots+=('workloads/guestbook')
          fi

          if ((${#roots[@]} == 0)); then
            roots+=(infra platform 'workloads/guestbook')
          fi

          printf 'roots=[' >> "$GITHUB_OUTPUT"
          printf '"%s",' "${roots[@]}" | sed 's/,$//' >> "$GITHUB_OUTPUT"
          printf ']\n' >> "$GITHUB_OUTPUT"

  plan:
    needs: select-roots
    runs-on: [self-hosted, Linux, X64, azure-lab]
    environment: lab-plan
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJSON(needs.select-roots.outputs.roots) }}
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set root-specific Terraform values
        shell: bash
        run: |
          if [[ "${{ matrix.root }}" == "infra" ]]; then
            raw_ranges='${{ vars.AKS_AUTHORIZED_IP_RANGES }}'
            IFS=',' read -ra ranges <<< "$raw_ranges"
            if ((${#ranges[@]} == 0)); then
              echo "::error::Set the lab-plan variable AKS_AUTHORIZED_IP_RANGES to comma-separated CIDRs."
              exit 1
            fi

            json='['
            for raw_cidr in "${ranges[@]}"; do
              cidr="${raw_cidr//[[:space:]]/}"
              if [[ ! "$cidr" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2}$ ]]; then
                echo "::error::AKS_AUTHORIZED_IP_RANGES contains an invalid CIDR: $cidr"
                exit 1
              fi
              json+="\"$cidr\","
            done
            json="${json%,}]"

            echo "TF_VAR_resource_group_name=${{ vars.LAB_RESOURCE_GROUP }}" >> "$GITHUB_ENV"
            echo "TF_VAR_api_server_authorized_ip_ranges=$json" >> "$GITHUB_ENV"
            echo "TF_VAR_aks_admin_principal_id=${{ vars.AKS_ADMIN_PRINCIPAL_ID }}" >> "$GITHUB_ENV"
            echo "TF_VAR_aks_admin_principal_type=${{ vars.AKS_ADMIN_PRINCIPAL_TYPE }}" >> "$GITHUB_ENV"
          elif [[ "${{ matrix.root }}" == "platform" ]]; then
            echo "TF_VAR_state_resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" >> "$GITHUB_ENV"
            echo "TF_VAR_state_storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" >> "$GITHUB_ENV"
            echo "TF_VAR_acme_email=${{ secrets.ACME_EMAIL }}" >> "$GITHUB_ENV"
          elif [[ "${{ matrix.root }}" == "workloads/guestbook" ]]; then
            echo "TF_VAR_state_resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" >> "$GITHUB_ENV"
            echo "TF_VAR_state_storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" >> "$GITHUB_ENV"
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4

      - name: Set up kubelogin
        if: matrix.root == 'platform'
        uses: azure/use-kubelogin@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Initialize remote state
        run: >-
          terraform init -input=false -reconfigure
          -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}"
          -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}"
          -backend-config="container_name=terraform-state"
          -backend-config="key=${{ matrix.root == 'infra' && 'infra.tfstate' || matrix.root == 'platform' && 'platform.tfstate' || 'guestbook.tfstate' }}"
          -backend-config="use_azuread_auth=true"
          -backend-config="use_oidc=true"
          -backend-config="client_id=${ARM_CLIENT_ID}"
          -backend-config="subscription_id=${ARM_SUBSCRIPTION_ID}"
          -backend-config="tenant_id=${ARM_TENANT_ID}"
        env:
          TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}

      - name: Create plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ matrix.root == 'workloads/guestbook' && 'workloads-guestbook' || matrix.root }}
          path: ${{ matrix.root }}/tfplan
          if-no-files-found: error